{% extends "base.html" %}
{% block title %}{{ 'Edit Goal' if goal else 'New Goal' }} – SoTo{% endblock %}

{% block content %}
<div class="form-wrap">
  <div class="form-card">
    <h1>{{ 'Edit Goal' if goal else 'New Goal' }}</h1>
    <p class="text-muted" style="margin-bottom:1.25rem;font-size:.875rem;">
      Section: <strong>{{ section.name }}</strong>
    </p>
    <form method="POST">
      <div class="form-group">
        <label for="name">Goal</label>
        <input type="text" id="name" name="name"
               value="{{ goal.name if goal else '' }}" required autofocus>
      </div>
      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          <option value="3" {{ 'selected' if goal and goal.priority == 3 }}>High</option>
          <option value="2" {{ 'selected' if (not goal) or (goal and goal.priority == 2) }}>Medium</option>
          <option value="1" {{ 'selected' if goal and goal.priority == 1 }}>Low</option>
        </select>
      </div>
      <div class="form-group">
        <label for="deadline">Deadline <span class="text-muted">(optional)</span></label>
        <input type="date" id="deadline" name="deadline"
               value="{{ goal.deadline.isoformat() if goal and goal.deadline else '' }}">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('sections.detail', section_id=section.id) }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
