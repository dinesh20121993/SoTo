{% extends "base.html" %}
{% block title %}{{ 'Edit Section' if section else 'New Section' }} – SoTo{% endblock %}

{% block content %}
<div class="form-wrap">
  <div class="form-card">
    <h1>{{ 'Edit Section' if section else 'New Section' }}</h1>
    <form method="POST">
      <div class="form-group">
        <label for="name">Section Name</label>
        <input type="text" id="name" name="name"
               value="{{ section.name if section else '' }}" required autofocus>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
